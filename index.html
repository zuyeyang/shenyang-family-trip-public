<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2026 沈阳四日家庭旅行安排" />
    <title>沈阳四日游 · 家庭行程</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="travel-app">
      <section class="map-stage" aria-label="沈阳旅行地图">
        <header class="map-title"><p>2026.09.10—09.13</p><h1>沈阳四日游</h1></header>
        <div id="route-map" role="img" aria-label="可缩放的沈阳旅行路线地图"></div>
        <div id="map-tooltip" class="map-tooltip" hidden></div>
        <div class="map-note">拖动或缩放地图 · 虚线表示当天推荐顺序，不是导航路径</div>
      </section>

      <aside class="side-panel" aria-live="polite">
        <nav id="day-tabs" class="day-tabs" aria-label="选择日期"></nav>
        <div id="sidebar-content"></div>
      </aside>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="app.js"></script>
  </body>
</html>
