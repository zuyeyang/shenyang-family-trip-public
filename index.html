<!doctype html>
<html lang="zh-CN">
  <head>

    <title>沈阳四日游 · 行程地图</title>
    <link rel="stylesheet" href="styles.css" />
    <style>.place-photo{margin:14px 0 0;border-radius:12px;overflow:hidden;background:#edf3f0}.place-photo img{display:block;width:100%;height:190px;object-fit:cover}.place-photo figcaption{padding:6px 10px;color:#70807d;font-size:12px;background:#f8faf9}.photo-fallback{height:140px;padding:20px;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(135deg,#dfeee9,#efe5d2);color:#456660}.photo-fallback span{font-size:12px;font-weight:700;letter-spacing:.12em}.photo-fallback b{font:700 24px "Noto Serif SC",serif;margin:4px 0}.photo-fallback small{font-size:12px;color:#6e817c}.sidebar-head{position:sticky;top:-20px;z-index:4;background:#fff;padding-top:20px}.control-row{display:flex;justify-content:flex-end;margin:-2px 0 12px}.filter-button{border:1px solid #dbe1df;border-radius:9px;background:#fff;color:#356f67;font:700 17px inherit;padding:6px 11px;cursor:pointer}.filter-panel{border:1px solid #dbe1df;border-radius:10px;background:#f8faf9;padding:12px;margin:-4px 0 16px}.filter-label{display:flex;justify-content:space-between;font-size:13px;color:#71807d;margin-bottom:9px}.filter-label button{border:0;background:none;color:#356f67;font:700 13px inherit;cursor:pointer}.filter-chips{display:flex;flex-wrap:wrap;gap:7px}.filter-chip{border:1px solid #dbe1df;background:#fff;color:#99a6a3;border-radius:20px;font:600 13px inherit;padding:6px 10px;cursor:pointer}.filter-chip.active{color:#24383a;border-color:#c8d8d3}.filter-chip i,.tag i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.panel-title h2{font:700 27px/1.25 "Noto Serif SC",serif;margin:0}.panel-title p:not(.eyebrow){margin:8px 0 18px;color:#52625f;font-size:15px;line-height:1.7}.overview-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.overview-metrics div{background:#f5f8f6;border-radius:9px;padding:10px}.overview-metrics small{display:block;color:#71807d;font-size:12px}.overview-metrics b{display:block;margin-top:4px;font-size:15px}.section-block{margin:18px 0}.section-block h3{font-size:15px;margin:0 0 9px}.day-overview-list{display:grid;gap:9px}.day-overview{display:block;width:100%;text-align:left;border:1px solid #dbe1df;border-radius:10px;background:#fff;padding:13px;cursor:pointer;font:inherit}.day-overview:hover{border-color:#9bc5ba}.day-overview b,.day-overview small{display:block}.day-overview b{font-size:16px;margin:4px 0}.day-overview p{margin:0 0 6px;color:#5b6c68;font-size:13px;line-height:1.55}.day-overview small{color:#71807d;font-size:12px;line-height:1.5}.day-label{color:#356f67;font-size:12px;font-weight:700}.muted-step{opacity:.35}.tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.tag{display:inline-flex;align-items:center;border-radius:12px;background:#ffffff2b;padding:4px 7px;font-size:12px}.place-photo .tag{background:#ffffff80;color:#456660}.map-tooltip .tag{background:#eef4f1;color:#526862}</style>
  </head>
  <body>
    <style>.travel-app{grid-template-columns:minmax(0,3fr) minmax(390px,2fr)}.side-panel{padding:22px 20px}.day-tabs{grid-template-columns:1.25fr repeat(4,1fr)}.day-tab:first-child{background:#f0f6f3}.day-tab:first-child.active{background:#356f67}.filter-panel{display:block!important}.filter-chip{min-height:30px}.overview-metrics b{white-space:nowrap}@media(max-width:820px){.travel-app{grid-template-columns:1fr}.sidebar-head{top:-16px}}</style>
    <style>.filter-label button:disabled{color:#9aa8a4;cursor:default}.calendar-days{display:grid;gap:14px}.calendar-day{border:1px solid #dbe1df;border-radius:12px;overflow:hidden;background:#fff}.calendar-day header{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#f5f8f6}.calendar-day header span{font-size:10px;color:#356f67;font-weight:700}.calendar-day header b{font-size:15px}.calendar-key{display:flex;justify-content:space-between;padding:8px 13px 4px;color:#71807d;font-size:10px}.calendar-track{height:400px;position:relative;margin:0 12px;border-left:2px solid #dce6e2;background:linear-gradient(to bottom,#fff2d9 0 26%,#fff 26% 52%,#f7ebdd 52% 74%,#eef3f5 74% 100%);border-radius:0 8px 8px 0}.sun-band{position:absolute;right:8px;color:#8a9b96;font-size:10px;opacity:.72}.sun-band.dawn{top:8%}.sun-band.noon{top:36%}.sun-band.dusk{top:62%}.calendar-event{position:absolute;left:12px;right:14px;top:var(--top);min-height:42px;height:var(--height);display:flex;align-items:center;gap:9px;text-align:left;border:1px solid #d2e2dc;border-left:4px solid #356f67;border-radius:8px;background:#fffffff2;padding:6px 8px;color:#24383a;font:inherit;cursor:pointer;overflow:hidden}.calendar-event:hover{border-color:#83b6a8;background:#fff}.calendar-event time{width:78px;flex:none;color:#356f67;font-size:10px;font-weight:700}.calendar-event b,.calendar-event small{display:block}.calendar-event b{font-size:12px}.calendar-event small{font-size:10px;color:#62736f;margin-top:2px}.calendar-day footer{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #dbe1df;padding:10px 13px;color:#627571;font-size:10px}.calendar-day footer b{color:#24383a;font-size:12px}</style>
    <main class="travel-app">
      <section class="map-stage" aria-label="沈阳旅行地图">
        <header class="map-title"><p id="trip-dates"></p><h1 id="trip-title"></h1></header>
        <div id="route-map" role="img" aria-label="可缩放的沈阳旅行路线地图"></div>
        <div id="map-tooltip" class="map-tooltip" hidden></div>
        <div class="map-note">拖动或缩放地图 · 实线为当天建议顺序</div>
      </section>

      <aside class="side-panel" aria-live="polite">
        <div class="sidebar-head">
          <p class="eyebrow">旅行看板</p>
          <nav id="day-tabs" class="day-tabs" aria-label="选择日期"></nav>
          <div class="control-row"><button id="filters-button" class="filter-button" type="button" title="恢复全部地图类别" aria-label="恢复全部地图类别">↻</button></div>
          <div id="filter-panel" class="filter-panel" hidden></div>
        </div>
        <div id="sidebar-content"></div>
      </aside>
    </main>
