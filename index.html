    <style>.place-photo{margin:14px 0 0;border-radius:12px;overflow:hidden;background:#edf3f0}.place-photo img{display:block;width:100%;height:190px;object-fit:cover}.place-photo figcaption{padding:6px 10px;color:#70807d;font-size:12px;background:#f8faf9}.photo-fallback{height:140px;padding:20px;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(135deg,#dfeee9,#efe5d2);color:#456660}.photo-fallback span{font-size:12px;font-weight:700;letter-spacing:.12em}.photo-fallback b{font:700 24px "Noto Serif SC",serif;margin:4px 0}.photo-fallback small{font-size:12px;color:#6e817c}.sidebar-head{position:sticky;top:-20px;z-index:4;background:#fff;padding-top:20px}.control-row{display:flex;justify-content:flex-end;margin:-2px 0 12px}.filter-button{border:1px solid #dbe1df;border-radius:9px;background:#fff;color:#356f67;font:700 17px inherit;padding:6px 11px;cursor:pointer}.filter-panel{border:1px solid #dbe1df;border-radius:10px;background:#f8faf9;padding:12px;margin:-4px 0 16px}.filter-label{display:flex;justify-content:space-between;font-size:13px;color:#71807d;margin-bottom:9px}.filter-label button{border:0;background:none;color:#356f67;font:700 13px inherit;cursor:pointer}.filter-chips{display:flex;flex-wrap:wrap;gap:7px}.filter-chip{border:1px solid #dbe1df;background:#fff;color:#99a6a3;border-radius:20px;font:600 13px inherit;padding:6px 10px;cursor:pointer}.filter-chip.active{color:#24383a;border-color:#c8d8d3}.filter-chip i,.tag i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.panel-title h2{font:700 27px/1.25 "Noto Serif SC",serif;margin:0}.panel-title p:not(.eyebrow){margin:8px 0 18px;color:#52625f;font-size:15px;line-height:1.7}.overview-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.overview-metrics div{background:#f5f8f6;border-radius:9px;padding:10px}.overview-metrics small{display:block;color:#71807d;font-size:12px}.overview-metrics b{display:block;margin-top:4px;font-   <body>
    <style>.travel-app{grid-template-columns:minmax(0,3fr) minmax(390px,2fr)}.side-panel{padding:22px 20px}.day-tabs{grid-template-columns:1.25fr repeat(4,1fr)}.day-tab:first-child{background:#f0f6f3}.day-tab:first-child.active{background:#356f67}.filter-panel{display:block!important}.filter-chip{min-height:30px}.overview-metrics b{white-space:nowrap}@media(max-width:820px){.travel-app{grid-template-columns:1fr}.sidebar-head{top:-16px}}</style>
    <style>.calendar-day{border:1px solid #dbe1df;border-radius:12px;overflow:hidden;background:#fff}.calendar-track{height:560px;position:relative;margin:0 12px;border-left:2px solid #dce6e2;border-radius:0 8px 8px 0;background:linear-gradient(to bottom,#fff8ea,#fff 48%,#f7fbfa)}.time-line{position:absolute;left:0;right:0;border-top:1px dashed #b7c9c3;color:#6f837e}.time-line b{position:absolute;right:7px;top:-9px;background:#fff;padding:0 4px;font-size:11px;font-weight:700}.noon-line{top:35.5%}.evening-line{top:74.2%}.calendar-event{position:absolute;left:12px;right:14px;top:var(--top);min-height:48px;height:var(--height);display:flex;align-items:center;gap:10px;text-align:left;border:1px solid #b8d4ca;border-left:4px solid #356f67;border-radius:8px;background:rgb(255 255 255 / .72);padding:7px 9px;color:#24383a;font:inherit;cursor:pointer;overflow:hidden}.calendar-event:hover{border-color:#83b6a8;background:#fffffff0}.calendar-event time{width:43px;flex:none;color:#356f67;font-size:11px;font-weight:700}.calendar-event b,.calendar-event small{display:block}.calendar-event b{font-size:14px}.calendar-event small{font-size:11px;color:#62736f;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calendar-point{position:absolute;z-index:3;left:10px;right:14px;top:var(--top);display:flex;align-items:baseline;gap:9px;text-align:left;border:0;border-left:3px solid #356f67;background:transparent;padding:3px 8px;color:#24383a;font:inherit;cursor:pointer}.calendar-point:hover{background:#eef6f2}.calendar-point time{width:43px;flex:none;color:#356f67;font-size:11px;font-weight:700}.calendar-point b{font-size:14px}.calendar-point small{color:#62736f;font-size:11px;margin-left:5px}.calendar-transfer{position:absolute;z-index:2;left:1px;top:var(--top);width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:#fffffff2;color:#50716b;font-size:16px;font-style:normal;transform:translateY(-50%);box-shadow:0 1px 4px #29483d20}.calendar-day footer{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #dbe1df;padding:13px;color:#627571;font-size:13px}.calendar-day footer b{color:#24383a;font-size:15px}.calendar-stay{border:0;background:transparent;padding:0;color:#356f67;font:700 14px inherit;text-align:left;cursor:pointer}.calendar-stay:hover{text-decoration:underline}.map-tooltip em{display:block;color:#5d6c69;font-size:12px;font-style:normal;line-height:1.5}.map-tooltip div{display:grid;gap:3px;margin-top:7px;padding-top:7px;border-top:1px solid #e1e8e5}.map-tooltip div span{font-size:11px;line-height:1.35}.map-tooltip div b{display:inline;margin:0;font:700 11px inherit;color:#356f67}</style>
    <style>.place-hero{padding:13px 15px}.place-hero h2{font-size:21px}.place-hero .address{font-size:13px;margin-top:5px}.place-section{padding-top:19px}.place-section h3{font-size:17px;margin-bottom:8px}.place-section p{font-size:15px;line-height:1.8}.fact-grid small{font-size:12px}.fact-grid b{font-size:14px}.place-price{margin-top:10px;padding:8px 10px;font-size:11px}.place-price b{font-size:14px}.calendar-event{background:rgb(255 255 255 / .48)}.calendar-event:hover{background:rgb(255 255 255 / .78)}.calendar-track{background:linear-gradient(to bottom,#fff8ea99,#fff9 48%,#f7fbfa99)}</style>
    <style>.filter-panel{padding:7px 0;margin:0 0 9px;border:0;background:transparent}.filter-chips{flex-wrap:nowrap;align-items:center;gap:5px}.filter-chip{padding:4px 7px;font-size:12px;white-space:nowrap}.filter-reset{margin-left:auto;border:0;background:transparent;color:#356f67;font-size:20px;font-weight:700;cursor:pointer;padding:0 2px}.day-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.day-title h2{font-size:23px}.day-title p{margin-bottom:10px!important}.time-zoom{display:flex;border:1px solid #dbe1df;border-radius:8px;overflow:hidden;flex:none}.time-zoom button{width:31px;height:30px;border:0;background:#fff;color:#6a807a;font-size:17px;cursor:pointer}.time-zoom button+button{border-left:1px solid #dbe1df}.time-zoom button.active{background:#356f67;color:#fff}.time-line{top:var(--at)}.calendar-event.lane-area{right:52%;border-left-color:#9b6eaa;background:rgb(248 242 251 / .56)}.calendar-event.lane-detail{left:51%;border-left-color:#dc795d}.calendar-event.lane-area time,.calendar-event.lane-detail time{width:38px}.calendar-event.lane-area b,.calendar-event.lane-detail b{font-size:12px}.calendar-event.lane-area small,.calendar-event.lane-detail small{font-size:10px;white-space:normal}.calendar-event.lane-area~.calendar-transfer{display:none}@media(max-width:420px){.filter-chip{padding:4px 5px;font-size:11px}.calendar-track{height:520px}}</style>
    <style>.calendar-event.nested-parent{right:52%;border-left-color:#9b6eaa;background:rgb(248 242 251 / .56)}.calendar-event.nested-child{left:var(--nested-left);right:var(--nested-right);border-left-color:#dc795d}.calendar-event.nested-parent time,.calendar-event.nested-child time{width:38px}.calendar-event.nested-parent b,.calendar-event.nested-child b{font-size:12px}.calendar-event.nested-parent small,.calendar-event.nested-child small{font-size:10px;white-space:normal}</style>
    <style>.calendar-track{height:max(560px,calc(100vh - 170px))}.calendar-event.nested-parent{right:53%}.calendar-event.nested-child{left:var(--nested-left);right:var(--nested-right);min-height:32px;padding:4px 5px}.calendar-event.nested-child time{width:34px;font-size:10px}.calendar-event.nested-child b{font-size:11px}.calendar-event.nested-child small{font-size:9px;line-height:1.2}.calendar-event.nested-child+ .calendar-transfer{display:none}</style>
    <style>
      .side-panel{overflow:hidden;display:flex;flex-direction:column}
      .sidebar-head{flex:none}
      .side-panel>#sidebar-content{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
      .overview-metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 14px}
      .overview-metrics div{padding:9px 8px}
      .overview-metrics small{font-size:11px}
      .overview-metrics b{font-size:14px}
      .overview-metric-action{display:block;border:0;border-radius:9px;background:#e8f2ee;padding:9px 8px;text-align:left;color:#24383a;font:inherit;cursor:pointer}
      .overview-metric-action:hover{background:#dcece6}
      .overview-metric-action small,.overview-metric-action b,.overview-metric-action em{display:block}
      .overview-metric-action small{color:#356f67;font-size:11px}
      .overview-metric-action b{margin-top:4px;font-size:14px}
      .overview-metric-action em{margin-top:2px;color:#356f67;font-size:10px;font-style:normal}
      .overview-periods{display:grid;gap:6px;margin:9px 0}
      .overview-periods div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:7px;align-items:start}
      .overview-periods small{color:#356f67;font-weight:700}
      .overview-periods span{color:#52625f;font-size:13px;line-height:1.55}
      .stay-panel-title h2{font-size:24px}
      .stay-panel-title p{margin-bottom:13px!important}
      .stay-booking-list{display:grid;gap:12px}
      .stay-booking-card{display:grid;grid-template-columns:116px minmax(0,1fr);width:100%;overflow:hidden;border:1px solid #dbe1df;border-radius:12px;background:#fff;padding:0;text-align:left;color:#24383a;font:inherit;cursor:pointer}
      .stay-booking-card:hover{border-color:#82b8aa;box-shadow:0 4px 16px #356f6715}
      .stay-booking-card figure{height:100%;min-height:176px;margin:0;background:#edf3f0}
      .stay-booking-card img{display:block;width:100%;height:100%;object-fit:cover}
      .stay-card-fallback{display:grid;height:100%;place-items:center;color:#356f67;font-size:28px}
      .stay-card-copy{padding:13px 12px}
      .stay-dates{display:block;color:#356f67;font-size:12px;font-weight:700}
      .stay-card-copy h3{margin:5px 0 7px;font:700 18px/1.25 "Noto Serif SC",serif}
      .stay-card-copy>b{display:block;font-size:13px}
      .stay-card-copy p{margin:6px 0 0;color:#556965;font-size:12px;line-height:1.45}
      .stay-card-copy .stay-booking-note{color:#6a7c77}
      .stay-card-copy>div{display:flex;justify-content:space-between;gap:8px;margin-top:9px;color:#356f67;font-size:12px;font-weight:700}
      .stay-card-copy em{font-style:normal;white-space:nowrap}
      @media(max-width:480px){.overview-metrics{grid-template-columns:repeat(2,1fr)}}
    </style>
    <style>
      .day-tabs{grid-template-columns:1.3fr 1.1fr repeat(4,1fr)}
      .city-tab b{font-size:14px}
      .city-stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 17px}
      .city-step{border:1px solid #dbe1df;border-radius:9px;background:#fff;color:#71807d;padding:8px 4px;font:inherit;cursor:pointer;text-align:center}
      .city-step b,.city-step span{display:block}.city-step b{font-size:11px}.city-step span{margin-top:2px;font-size:12px;font-weight:700}
      .city-step.active{background:#356f67;border-color:#356f67;color:#fff}
      .city-guide-head h2{margin:0;font:700 25px/1.3 "Noto Serif SC",serif}
      .city-guide-head>p:not(.eyebrow){margin:8px 0 15px;color:#52625f;font-size:14px;line-height:1.65}
      .city-facts{display:grid;gap:8px}
      .city-facts article{display:grid;grid-template-columns:104px minmax(0,1fr);gap:9px;align-items:start;border:1px solid #dbe1df;border-radius:10px;padding:10px 11px;background:#fff}
      .city-facts b{color:#356f67;font-size:12px}.city-facts span{color:#536562;font-size:12px;line-height:1.55}
      .city-fact{display:grid;grid-template-columns:104px minmax(0,1fr);gap:9px;align-items:start;width:100%;border:1px solid color-mix(in srgb,var(--tone) 32%,#dbe1df);border-radius:10px;padding:10px 11px;background:#fff;text-align:left;font:inherit;cursor:pointer}
      .city-fact:hover{background:color-mix(in srgb,var(--tone) 8%,#fff)}
      .city-fact b{color:var(--tone)}
      .city-next{display:flex;justify-content:space-between;width:100%;margin-top:14px;border:0;border-radius:10px;background:#e7f1ee;color:#285d54;padding:12px 13px;font:700 14px inherit;cursor:pointer}
      .city-next span{font-size:18px;line-height:.8}
      .guide-label,.guide-detail,.guide-line-label,.guide-story-year{font-family:"Noto Sans SC",system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
      .guide-label{fill:#274842;font-size:14px;font-weight:800}.guide-detail{fill:#536864;font-size:10px;font-weight:600}.guide-line-label{fill:#9b5d17;font-size:13px;font-weight:800}.guide-story-year{fill:#fff;stroke:none;font-size:9px;font-weight:800}
      .guide-story{pointer-events:all;cursor:pointer}.guide-story circle{stroke:#fff;stroke-width:3px;filter:drop-shadow(0 3px 5px #203c3533)}
      @media(max-width:520px){.day-tabs{grid-template-columns:1.35fr 1.1fr repeat(4,1fr)}.city-tab b{font-size:12px}.city-tab small{font-size:9px}.city-facts article{grid-template-columns:82px minmax(0,1fr)}}
    </style>
    <main class="travel-app">
      <section class="map-stage" aria-label="沈阳旅行地图">
        <header class="map-title"><p id="trip-dates"></p><h1 id="trip-title"></h1></header>
        <div id="route-map" role="img" aria-label="可缩放的沈阳旅行路线地图"></div>
        <div id="map-tooltip" class="map-tooltip" hidden></div>
        <div class="map-note">拖动或缩放地图 · 实线为当天建议顺序</div>
      </section>

      <aside class="side-panel" aria-live="polite">
        <div class="sidebar-head">
          <nav id="day-tabs" class="day-tabs" aria-label="选择日期"></nav>
          <div id="filter-panel" class="filter-panel" hidden></div>
        </div>
        <div id="sidebar-content"></div>
      </aside>
    </main>
